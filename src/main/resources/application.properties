
spring.application.name=dorm-repair-backend

server.port=8080

# PostgreSQL
spring.datasource.url=jdbc:postgresql://localhost:5432/dorm_repair_db
spring.datasource.username=sota
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=org.postgresql.Driver

app.jwt.secret=${JWT_SECRET}
app.jwt.ttl-seconds=3600
app.cors.origins=${CORS_ORIGINS:http://localhost:5173}

# Stage A: keep the engine disabled for the existing database.
flowable.process.enabled=false
flowable.database-schema-update=false
flowable.async-executor-activate=false
flowable.idm.enabled=false
flowable.eventregistry.enabled=false

# Keep all business writes blocked until the approved workflow migration/activation.
app.workflow.enabled=false
