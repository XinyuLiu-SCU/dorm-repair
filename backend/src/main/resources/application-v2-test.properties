# V2.0-A isolated foundation only. No Flowable deployment or business workflow writes.
server.address=127.0.0.1
server.port=18081
app.v2.enabled=true
spring.datasource.username=${V2_DB_USER}
spring.datasource.password=${V2_DB_PASSWORD:}
app.jwt.secret=${V2_JWT_SECRET}
app.workflow.enabled=false
flowable.process.enabled=false
flowable.database-schema-update=false
flowable.async-executor-activate=false
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/v2/business
spring.flyway.default-schema=v2_business_history
spring.flyway.schemas=v2_business_history
spring.flyway.create-schemas=true
spring.flyway.baseline-on-migrate=false
spring.flyway.clean-disabled=true
spring.flyway.validate-on-migrate=true
spring.flyway.validate-migration-naming=true
spring.flyway.group=true
spring.flyway.mixed=false

app.v2.environment=TEST
spring.datasource.url=jdbc:postgresql://127.0.0.1:5432/dorm_repair_v2_test
